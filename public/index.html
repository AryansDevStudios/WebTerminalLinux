<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web Terminal (SSE, no WebSocket)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- xterm.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.1.0/css/xterm.css" />
    <style>
      html,body { height:100%; margin:0; background:#1e1e1e; display:flex; }
      #terminal { flex:1; }
      .toolbar { position: absolute; top:8px; right:8px; z-index:10; color:#fff; font-family: sans-serif; }
      button { margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div class="toolbar">
      <button id="clear">Clear</button>
    </div>

    <script src="https://unpkg.com/xterm@5.1.0/lib/xterm.js"></script>
    <script>
      const term = new window.Terminal({
        cols: 80,
        rows: 24,
        cursorBlink: true,
        convertEol: true
      });
      term.open(document.getElementById("terminal"));

      // Hook up SSE for terminal output
      const es = new EventSource("/events");
      es.onmessage = (ev) => {
        // server sent JSON-encoded string to preserve newlines
        try {
          const text = JSON.parse(ev.data);
          term.write(text);
        } catch (e) {
          term.write(ev.data);
        }
      };
      es.onerror = (e) => {
        // show small notice
        // Do not spam the terminal; just show a one-time message.
        term.write("\r\n*** Connection to server lost. Reload to reconnect. ***\r\n");
        es.close();
      };

      // Send user input via POST /input
      // Use a small buffer and throttle to avoid too many requests on fast typing.
      let inputBuffer = "";
      let sendTimer = null;
      const SEND_INTERVAL = 40; // ms

      function scheduleSend() {
        if (sendTimer) return;
        sendTimer = setTimeout(async () => {
          const payload = inputBuffer;
          inputBuffer = "";
          sendTimer = null;
          if (!payload) return;
          try {
            await fetch("/input", {
              method: "POST",
              headers: {
                "Content-Type": "text/plain; charset=utf-8"
              },
              body: payload
            });
          } catch (e) {
            // ignore
          }
        }, SEND_INTERVAL);
      }

      term.onData((data) => {
        // data is the keystroke sequence; forward as-is
        inputBuffer += data;
        scheduleSend();
      });

      // Resize handling: notify server with cols/rows
      function notifyResize() {
        const dims = { cols: term.cols, rows: term.rows };
        navigator.sendBeacon ?
          navigator.sendBeacon("/resize", JSON.stringify(dims)) :
          fetch("/resize", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dims) });
      }

      window.addEventListener("resize", () => {
        term.fit && term.fit(); // fit addon optional (not loaded here)
        notifyResize();
      });

      // initial resize
      notifyResize();

      document.getElementById("clear").addEventListener("click", () => term.clear());
    </script>
  </body>
</html>
